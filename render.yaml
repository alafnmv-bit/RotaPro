services:
  - type: web
    name: rotapro-entregas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rotapro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: rotapro-db
    plan: free
